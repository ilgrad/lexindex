[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "lexindex"
version = "4.5.0"
description = "Compact, immutable string<->id indexes for huge catalogs: a front-coded dictionary with prefix and range queries, an ordered FST that adds fuzzy and subsequence search, and minimal-perfect-hash maps (the compact one is 1.24 B/key)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilia Gradina", email = "ilia.gradina@gmail.com" }]
keywords = [
    "index",
    "fst",
    "perfect-hash",
    "prefix",
    "fuzzy",
    "autocomplete",
    "catalog",
    "string-interning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# The crate's own command line, which the extension carries: `cargo install lexindex` installs a
# binary of the same name running the same program, so either one first on the path answers alike.
[project.scripts]
lexindex = "lexindex.__main__:main"

[project.urls]
Homepage = "https://github.com/ilgrad/lexindex"
Repository = "https://github.com/ilgrad/lexindex"
Documentation = "https://ilgrad.github.io/lexindex/"
Issues = "https://github.com/ilgrad/lexindex/issues"
Changelog = "https://github.com/ilgrad/lexindex/blob/main/CHANGELOG.md"
Sponsor = "https://github.com/sponsors/ilgrad"

[tool.maturin]
features = ["python"]
module-name = "lexindex._core"
python-source = "python"
# The sdist follows the crate's `exclude`, which keeps the Python tests out of the Rust tarball; a
# source distribution is what a packager builds *and tests* from, so they ride along in that one.
include = [{ path = "tests/test_python.py", format = "sdist" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
