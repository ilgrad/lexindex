# libFuzzer targets for lexindex's *safe* blob parsers. Not published, not a workspace member of the
# crate above it, and never built by the normal gate — `sanitize.yml` runs it on a schedule.
[package]
name = "lexindex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# `fuzzing` exposes the framing parsers, which is where the interesting branches are: since 1.0 the
# loaders themselves are safe, so a target could call them directly, but it would then spend most of
# its budget re-deriving the same framing rejections through an extra allocation per case.
#
# `StringIndex::from_bytes` had a target once and lost it: it found a real defect in ten minutes —
# 44 bytes carrying a matching FST checksum panic in `fst`'s node decoder — but that defect was in a
# claim rather than in code this crate could fix, so the target only re-found an accepted panic
# every week and taught us to ignore a red job. `parse_string` is its replacement and fuzzes
# `from_untrusted_bytes` instead, which walks every node inside `catch_unwind` and so *can* promise
# the rejection the old one kept disproving.
[dependencies.lexindex]
path = ".."
features = ["fuzzing"]

[[bin]]
name = "parse_compact"
path = "fuzz_targets/parse_compact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_closed"
path = "fuzz_targets/parse_closed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_dict"
path = "fuzz_targets/parse_dict.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_perfect"
path = "fuzz_targets/parse_perfect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_overlay"
path = "fuzz_targets/parse_overlay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_overlay_untrusted"
path = "fuzz_targets/parse_overlay_untrusted.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_string"
path = "fuzz_targets/parse_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_mphf"
path = "fuzz_targets/parse_mphf.rs"
test = false
doc = false
bench = false

# Keeps cargo from trying to fold this package into the crate above it.
[workspace]

# Link-time optimisation has to stay off, and this block is only half of saying so: cargo lets a
# `[profile.release]` in any `config.toml` in scope override a manifest profile, so a machine whose
# cargo config sets `lto` needs `CARGO_PROFILE_RELEASE_LTO=false` in the environment as well (an env
# override outranks both). Under LTO the dependency crates are re-codegen'd from bitcode, which does
# not carry the coverage instrumentation rustc applied when it emitted their object code — measured,
# `parse_compact` fell from 2 599 instrumented edges to 331, all of them in this crate, so a real
# blob and a one-byte input reached the same 15 and the fuzzer explored nothing while still
# reporting "no crashes".
[profile.release]
lto = false
debug = 1
