# Two ecosystems, both on a weekly cadence: a security fix should not wait a month, and a routine
# bump should not arrive daily. Everything is grouped into one PR per ecosystem -- a `cargo audit`
# advisory is the channel that must interrupt, not a queue of single-line version bumps.
version: 2
updates:
  # The actions are pinned to commit SHAs, which is what makes this entry necessary rather than
  # merely tidy: a SHA does not follow `v4`, so without Dependabot the pins would silently rot at
  # whatever the tag pointed to on the day they were written.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]

  # Not a workspace member and not published; its lockfile still pins libFuzzer's dependency tree,
  # and `cargo audit` reads it.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    groups:
      fuzz:
        patterns: ["*"]
