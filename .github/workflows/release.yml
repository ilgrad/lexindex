name: Release

# Build redistributable wheels for every platform and (on a version tag) publish to PyPI.
# Publishing uses PyPI Trusted Publishing (OIDC) — add a pending publisher for this repo at
# https://pypi.org/manage/account/publishing/ (workflow `release.yml`, environment `pypi`) before the
# first `v*` tag, and create a `pypi` environment in the repo settings.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag is the one irreversible step in this repo: PyPI and crates.io refuse a re-upload of the
  # same version, so a mismatched manifest can only be fixed by burning a version number. Everything
  # a human keeps in sync by hand is therefore checked here, before any artefact is built.
  preflight:
    name: preflight (versions agree with the tag)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: tag == Cargo.toml == pyproject.toml == CITATION.cff == CHANGELOG
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          fail=0
          check() { # name, found, want
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', expected '$3'"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }
          check Cargo.toml "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" "$ver"
          check pyproject.toml "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" "$ver"
          check CITATION.cff "$(grep -m1 '^version:' CITATION.cff | awk '{print $2}' | tr -d '"')" "$ver"
          grep -q "^## \[$ver\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$ver]' section"; fail=1; }
          # An undated heading means the release notes were never finished.
          grep -qE "^## \[$ver\] . [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md '## [$ver]' heading carries no release date"; fail=1; }
          exit $fail

  wheels:
    name: wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          # musl wheels for Alpine / musl-based (distroless) containers
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          # macOS x86_64 is cross-built on the arm64 macos-14 runner: dedicated Intel (macos-13)
          # runners are scarce/deprecated. abi3 needs no interpreter at build time, so this is sound.
          - { runner: macos-14, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'auto' }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    name: publish to crates.io
    runs-on: ubuntu-latest
    needs: [preflight]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # OIDC token for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Tokenless Trusted Publishing (OIDC), like the PyPI job above. Configure a trusted publisher for
      # this repo once at https://crates.io/crates/lexindex/settings before the next `v*` tag.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # Both registries, not just PyPI: a Release announcing a version that never reached crates.io
    # (and, through it, Zenodo's archive) would be the wrong record of what shipped.
    needs: [publish, crates-io]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          echo "----- release notes -----"; cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: lexindex ${{ github.ref_name }}
          body_path: release-notes.md
