name: Release

# Build redistributable wheels for every platform and (on a version tag) publish to PyPI.
# Publishing uses PyPI Trusted Publishing (OIDC) — add a pending publisher for this repo at
# https://pypi.org/manage/account/publishing/ (workflow `release.yml`, environment `pypi`) before the
# first `v*` tag, and create a `pypi` environment in the repo settings.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag is the one irreversible step in this repo: PyPI and crates.io refuse a re-upload of the
  # same version, so a mismatched manifest can only be fixed by burning a version number. Everything
  # a human keeps in sync by hand is therefore checked here, before any artefact is built.
  preflight:
    name: preflight (versions agree with the tag)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: tag == Cargo.toml == pyproject.toml == CITATION.cff == CHANGELOG
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          fail=0
          check() { # name, found, want
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', expected '$3'"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }
          check Cargo.toml "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" "$ver"
          check pyproject.toml "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" "$ver"
          check CITATION.cff "$(grep -m1 '^version:' CITATION.cff | awk '{print $2}' | tr -d '"')" "$ver"
          # The README install snippet is hand-maintained too: 0.9.0 shipped telling users "0.8".
          minor="${ver%.*}"
          grep -q "^lexindex = \"$minor\"" README.md \
            || { echo "::error::README.md install snippet does not say lexindex = \"$minor\""; fail=1; }
          grep -q "version = \"$minor\", default-features = false" README.md \
            || { echo "::error::README.md fst-only snippet does not say version = \"$minor\""; fail=1; }
          grep -q "^## \[$ver\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$ver]' section"; fail=1; }
          # An undated heading means the release notes were never finished.
          grep -qE "^## \[$ver\] . [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md '## [$ver]' heading carries no release date"; fail=1; }
          exit $fail

  # The full CI matrix — fmt, clippy, tests on Linux/macOS/Windows, Python 3.11–3.14, MSRV,
  # coverage — as a reusable workflow, so a tag cannot publish what a push to main would reject.
  ci:
    name: ci
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  # The one thing a normal `cargo test` cannot see: an out-of-bounds read past ptr_hash's remap is
  # silent in release and only trips a debug assertion in a minority of builds. That defect is the
  # reason this crate exists to guard `overflow_cap`; publishing a version that reintroduced it would
  # be irreversible. The weekly Sanitizers workflow catches it eventually — this gate catches it
  # *before* the tag ships. Lean by design: the `--lib --tests` ASan run, nothing else.
  asan:
    name: AddressSanitizer gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # `--target` keeps the sanitizer flags off build scripts/proc-macros (they run on an
      # uninstrumented host); `--lib --tests` skips doctests, which do not link the ASan runtime.
      - name: cargo test under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test --target x86_64-unknown-linux-gnu --lib --tests

  wheels:
    name: wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    needs: [preflight]
    # preflight is tag-only; a skipped dependency skips its dependants by default, which is what
    # left every `workflow_dispatch` run without wheels. Run unless preflight actually failed.
    if: ${{ !cancelled() && needs.preflight.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # `smoke`: the wheel can execute on this runner (native target), so install and run it.
          - { runner: ubuntu-latest, target: x86_64, smoke: true }
          - { runner: ubuntu-latest, target: aarch64 }
          # musl wheels for Alpine / musl-based (distroless) containers
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          # macOS x86_64 is cross-built on the arm64 macos-14 runner: dedicated Intel (macos-13)
          # runners are scarce/deprecated. abi3 needs no interpreter at build time, so this is sound.
          - { runner: macos-14, target: x86_64 }
          - { runner: macos-14, target: aarch64, smoke: true }
          - { runner: windows-latest, target: x64, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          sccache: "true"
      # A wheel that builds is not a wheel that imports: install the artefact into the runner's
      # interpreter from a directory outside the checkout (so the source tree cannot shadow it)
      # and exercise every index through build, query, save and load.
      - name: smoke test the wheel
        if: matrix.platform.smoke
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist lexindex
          cd "$RUNNER_TEMP"
          python - <<'EOF'
          import lexindex
          idx = lexindex.StringIndex(["banana", "apple"])
          assert idx.id("apple") == 0 and idx.key(1) == "banana"
          idx.save("smoke.bix")
          assert lexindex.StringIndex.load("smoke.bix").prefix("b") == [("banana", 1)]
          c = lexindex.CompactHashIndex(["a", "b"])
          assert c.contains("a")
          assert lexindex.CompactHashIndex.from_bytes(c.to_bytes()).id("b") == c.id("b")
          p = lexindex.PerfectHashIndex(["x", "y"])
          p.save("smoke.bmp")
          assert lexindex.PerfectHashIndex.load_mmap("smoke.bmp").key(p.id("y")) == "y"
          print("smoke ok:", lexindex.__version__)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'auto' }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [preflight]
    if: ${{ !cancelled() && needs.preflight.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [ci, asan, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    name: publish to crates.io
    runs-on: ubuntu-latest
    needs: [ci, asan, preflight]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # OIDC token for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Tokenless Trusted Publishing (OIDC), like the PyPI job above. Configure a trusted publisher for
      # this repo once at https://crates.io/crates/lexindex/settings before the next `v*` tag.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # Both registries, not just PyPI: a Release announcing a version that never reached crates.io
    # (and, through it, Zenodo's archive) would be the wrong record of what shipped.
    needs: [publish, crates-io]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          echo "----- release notes -----"; cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: lexindex ${{ github.ref_name }}
          body_path: release-notes.md
