name: Sanitizers

# Undefined behaviour does not show up in a normal `cargo test`: the defect this workflow exists to
# catch (an out-of-bounds read past ptr_hash's remap) only tripped a debug assertion in one build out
# of a few dozen, and was silent in release. The fuzz job below is here for the same reason from the
# other side: the blob parsers are the only place untrusted bytes reach. Weekly rather than per-push
# because all three are slow and none is a gate on a green PR.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  asan:
    name: AddressSanitizer (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--target` is required: without it the sanitizer flags also instrument build scripts and
      # proc-macros, which then run under an uninstrumented host and fail to link.
      # `--lib --tests` skips doctests: rustdoc does not link the sanitizer runtime into the
      # snippets it compiles, so they fail with undefined `__asan_*` symbols before running.
      - name: cargo test under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test --target x86_64-unknown-linux-gnu --lib --tests

  miri:
    name: Miri (fst only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Deliberately narrow: the interpreter is orders of magnitude slower than the machine, so it
      # goes where lexindex does its own byte-range and pointer work — `blob` (the shared,
      # range-limited views every index borrows from) and `subsequence` (the automaton's index
      # arithmetic). ASan above covers the rest. Interpreting the whole fst suite would take hours
      # and add nothing.
      # Isolation off because these tests write real files; under Miri's default isolation those
      # calls are refused rather than checked.
      - name: cargo miri test (blob + subsequence)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test --no-default-features --lib blob::
          cargo +nightly miri test --no-default-features --lib subsequence::
      # Every scalar in every blob this crate writes is little-endian, and every reader says so
      # with `from_le_bytes` -- but `to_ne_bytes` compiles, passes on x86 and silently writes a
      # different file on a big-endian machine. There is no big-endian runner and there does not
      # need to be one: the interpreter has the target. Measured negative control -- flipping the
      # arena's count field to `to_ne_bytes` passes `cargo test` and fails eight tests here.
      #
      # `mphf::` is deliberately absent. Its blob tests go through a 263 000-key build, which is
      # hours under an interpreter; `the_golden_blob_parses_and_writes_back_identically` reads the
      # committed `MPH1` fixture instead and pins the same header, in 12 seconds for the whole job.
      #
      # `dict_index::` earns its place here more than any other format: `BDX1` is the newest, and it
      # stores the first eight bytes of each block head as a *big-endian* word inside an otherwise
      # little-endian blob, which is exactly the mix this job exists to catch. Three tests, 781 s
      # measured -- the round trip, the length/table checks, and the varints.
      - name: cargo miri test on a big-endian target (the byte formats)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test --target s390x-unknown-linux-gnu --lib -- \
            blob:: arena:: mphf::tests::the_golden_blob_parses_and_writes_back_identically \
            dict_index::tests::save_and_load \
            dict_index::tests::every_length_and_table_in_a_blob_is_checked \
            dict_index::tests::varints_round_trip_and_a_cut_or_oversized_one_is_refused
      # The only place 32-bit code actually *runs*. `cargo check --target i686` is its own CI job,
      # but a compilation check cannot see a `u64 -> usize` truncation, and there is no 32-bit
      # runner to test on — Miri needs neither, since it interprets. It earned this on its first
      # run, catching a test that pinned an error message which is a property of the pointer width.
      # `overlay::` builds a perfect hash under the interpreter and costs minutes: weekly, not per
      # push. `dict_index::` contributes its two parser tests -- the ones whose arithmetic is
      # pointer-width-sensitive (`usize::try_from` on an id, `id / block`, the array bounds a load
      # without the walk relies on). `every_length_and_table_in_a_blob_is_checked` is not on this
      # list: it is about byte layout rather than pointer width, the big-endian job runs it, and it
      # is the expensive one (the three-test i686 set measured 1 758 s with it, far less without).
      - name: cargo miri test on a 32-bit target (the parsers)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test --target i686-unknown-linux-gnu --lib -- arena:: overlay:: \
            dict_index::tests::a_load_without_the_walk_bounds_what_the_arrays_say \
            dict_index::tests::corrupted_block_data_never_panics

  # The hash's own quality battery. It is `#[ignore]`d and behind `bench-mphf` because it runs for
  # tens of seconds, and until now CI only *compiled* it -- `ci.yml` runs `clippy --features
  # bench-mphf` and nothing executes the test, so the committed artifact was a hand-run and a
  # regression in either hash would have waited for somebody to remember. The two-byte differential
  # scan in here is what caught the pre-2.0 collision family; that is not a check to run by hand.
  hash-quality:
    name: hash quality battery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--release`: the battery is tens of millions of hashes and a debug build turns tens of
      # seconds into tens of minutes. The runner has no `/usr/share/dict/words`, so the corpus
      # families are generated -- the battery says which it ran on in its first lines.
      - name: cargo test --release --features bench-mphf -- --ignored hash_quality
        run: cargo test --release --features bench-mphf -- --ignored --nocapture hash_quality

  # Dependabot is deliberately *not* configured for this repository: any merged bot PR puts
  # `dependabot[bot]` into the contributor list, and that list is kept to people. What the bot would
  # have noticed is checked here instead, weekly, and reported as a failing job; the pins then move
  # in a human's own commit. Never a gate on a PR. A pin is stale when it is not the commit behind
  # the action's latest release. `dtolnay/rust-toolchain` is the exception: its refs *are* its
  # inputs (`@stable`, `@nightly`), its one release tag `v1` is years behind `master`, and this repo
  # pins `master` on purpose -- so for it the check is the pinned commit's age, 180 days. A crate is
  # behind when `cargo update --dry-run` would move it, or knows a newer version that the MSRV does
  # *not* rule out -- one that the MSRV does rule out is a decision already taken, not a nudge.
  freshness:
    name: pins and dependencies are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: action pins against their latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > stale.txt
          grep -rhoE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}' .github/workflows \
            | sed 's/^uses: //' | sort -u > pins.txt
          while IFS=@ read -r repo sha; do
            if [ "$repo" != dtolnay/rust-toolchain ] \
               && tag=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null); then
              latest=$(gh api "repos/$repo/commits/$tag" --jq .sha)
              if [ "$latest" != "$sha" ]; then
                echo "$repo: pinned ${sha:0:7}, latest release $tag is ${latest:0:7}" >> stale.txt
              fi
            else
              when=$(gh api "repos/$repo/commits/$sha" --jq .commit.committer.date)
              age=$(( ( $(date +%s) - $(date -d "$when" +%s) ) / 86400 ))
              if [ "$age" -gt 180 ]; then
                echo "$repo: tracked by commit; pinned one is $age days old" >> stale.txt
              fi
            fi
          done < pins.txt
          if [ -s stale.txt ]; then
            sed 's/^/::warning::/' stale.txt
            exit 1
          fi
          echo "all $(wc -l < pins.txt) pins are current"
      - name: crates against their latest compatible and latest available versions
        run: |
          set -euo pipefail
          behind=0
          for m in Cargo.toml fuzz/Cargo.toml; do
            out=$(cargo update --dry-run --verbose --manifest-path "$m" 2>&1)
            # `Updating` = a compatible bump the lockfile has not taken; `Unchanged ... (available:` =
            # a newer major, unless the MSRV is what rules it out.
            if echo "$out" | grep -E '^\s*Updating [A-Za-z0-9_-]+ v|^\s*Unchanged .*\(available:' \
                 | grep -v 'requires Rust' | sed "s|^|::warning::$m: |" | grep .; then
              behind=1
            fi
          done
          exit $behind

  fuzz:
    name: libFuzzer (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_compact
          - parse_closed
          - parse_dict
          - parse_perfect
          - parse_overlay
          - parse_overlay_untrusted
          - parse_mphf
          - parse_string
          # Not a blob parser: `inspect` reads a header of any of the formats above and was found
          # non-total on a crafted overlay, so the target holds it to a return value on any bytes.
          - parse_inspect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target\nfuzz -> fuzz/target"
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # The corpus lives across runs: what one week's ten minutes reached, the next starts from.
      # A key that no run shares makes every run save; the prefix restores the newest one saved.
      - name: restore the corpus the last run left
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # The blobs `tests/golden.rs` checks are the seed corpus: reaching a valid header by chance is
      # hopeless (magic, two checksums and a length that must agree), so without seeds the fuzzer
      # only ever exercises the rejection paths. Ten minutes per target is the budget that keeps this
      # job comparable to the two above; it is a regression net, not a campaign.
      #
      # LTO must stay off or the run is theatre: it re-codegens the lexindex crate from bitcode and
      # drops the coverage instrumentation, leaving libFuzzer blind to everything outside the target
      # crate. The manifest says so too, but a `config.toml` outranks a manifest profile and only an
      # env override outranks both.
      # The seeds first, with no mutation at all. A target that dies on its own corpus is a bug in
      # the target, and it reads identically to a real finding in the ten-minute run below --
      # `parse_string` shipped that way once, aborting on a committed blob because libfuzzer-sys's
      # panic hook fires before the `catch_unwind` the loader is built around. This step names it.
      - name: ${{ matrix.target }} accepts its own seed corpus
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} tests/data -- -runs=0

      - name: fuzz ${{ matrix.target }} for 10 minutes
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} tests/data \
            -- -max_total_time=600 -print_final_stats=1
      - name: save the corpus for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: upload the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
