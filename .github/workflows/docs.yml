name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - python/**
      - CHANGELOG.md
      - .github/workflows/docs.yml
  # Every published GitHub Release (release.yml auto-creates one on a v* tag) refreshes the site,
  # so a release always ships its docs even when the release commit only touches root files.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Build extension + deploy docs
        run: |
          uv venv
          uv pip install maturin mkdocs-material "mkdocstrings[python]" ruff
          # mkdocstrings imports the package, so the compiled core must be built first.
          uv run maturin develop --release
          uv run mkdocs gh-deploy --force --no-history
