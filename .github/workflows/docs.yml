name: docs

on:
  push:
    branches: [main]
    # Every file the site is built from. Two pages include `CHANGELOG.md` and `polars/README.md` as
    # snippets, and mkdocstrings renders a compiled class or function from the docstring the
    # extension carries — the doc comment in `src/python.rs` — rather than from the stub.
    paths:
      - docs/**
      - mkdocs.yml
      - python/**
      - CHANGELOG.md
      - polars/README.md
      - src/python.rs
      - .github/workflows/docs.yml
  # No `release` trigger: release.yml creates the GitHub Release with `GITHUB_TOKEN`, whose events
  # start no workflow. None is needed — a tag adds nothing the site is built from, and the push of
  # the commit it names has deployed it already — and a deploy from the tag could replace a newer
  # main with an older tree.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # `uv.lock` is gitignored, so the cache's dependency glob matches nothing and the
          # post-step would fail on it; off is exactly the v5 behaviour this job was written for.
          enable-cache: false
      - name: Build extension + deploy docs
        run: |
          uv venv
          uv pip install maturin mkdocs-material "mkdocstrings[python]" ruff
          # mkdocstrings imports the package, so the compiled core must be built first.
          uv run maturin develop --release
          uv run mkdocs gh-deploy --force --no-history
