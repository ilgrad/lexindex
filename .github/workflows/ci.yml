name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Reused by release.yml: a tag must not publish what a push to main would have rejected.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt · clippy · test · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-llvm-cov
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default = with mph)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (no-default-features = fst only)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: test (default)
        run: cargo test
      - name: test (no-default-features)
        run: cargo test --no-default-features
      # Debug and release are different programs here: `debug_assert!`s inside ptr_hash and
      # cacheline-ef fire only in debug, and the optimiser is free to reorder the bounds reasoning
      # they document. The regression tests for the remap bound are only meaningful in both.
      - name: test (release)
        run: cargo test --release
      - name: cargo audit
        run: cargo audit
      - name: coverage (llvm-cov, floor 95% lines; default = mph + mmap)
        run: cargo llvm-cov --summary-only --fail-under-lines 95

  # The release workflow ships wheels for Windows and macOS, so their platform-specific code paths
  # — `save`'s rename-over-existing and permission handling, mmap — deserve a test run, not just a
  # cross-build. Tests only: fmt/clippy/audit/coverage are platform-independent and stay on the
  # Linux job above.
  rust-platforms:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test (default)
        run: cargo test
      - name: test (no-default-features)
        run: cargo test --no-default-features

  python-build:
    name: python (ruff · clippy · build)
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff check python/ tests/test_python.py
      - name: ruff format --check
        run: uvx ruff format --check python/ tests/test_python.py
      - name: clippy (python bindings)
        run: cargo clippy --features python -- -D warnings
      - name: build abi3 wheel
        run: uv run --with maturin maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  python-test:
    name: python (pytest · stubtest · py${{ matrix.python-version }})
    needs: python-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      # Install-only: the single abi3 wheel must import and pass on every supported interpreter.
      - name: pytest
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --python ${{ matrix.python-version }} --with pytest --with "$wheel" \
            pytest tests/test_python.py -q
      - name: stubtest
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --python ${{ matrix.python-version }} --with mypy --with "$wheel" \
            python -m mypy.stubtest lexindex

  # Two claims in the README that nothing else would catch when they rot: the `fst`-only build
  # works on 32-bit targets (wasm included), and turning `mph` on there fails with *our* one-line
  # explanation rather than a cascade from inside `sucds`. `check`, not `test`: there is no 32-bit
  # runner to execute on, and both are compilation properties.
  targets:
    name: targets (fst-only on 32-bit, mph guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: check (fst-only, i686)
        run: cargo check --no-default-features --target i686-unknown-linux-gnu
      - name: check (fst-only, wasm32)
        run: cargo check --no-default-features --target wasm32-unknown-unknown
      - name: the mph feature explains itself off 64-bit
        run: |
          if cargo check --target i686-unknown-linux-gnu > check.log 2>&1; then
            echo "::error::a 32-bit build with mph succeeded - the guard in src/lib.rs is stale"
            exit 1
          fi
          grep -q "requires a 64-bit target" check.log || {
            echo "::error::a 32-bit mph build failed without lexindex's own message"
            cat check.log
            exit 1
          }
          # `CARGO_TERM_COLOR: always` puts escape codes ahead of every "error", so counting them
          # here would report nonsense; the two assertions above are the check.
          echo "ok: the 32-bit build failed carrying lexindex's own explanation"

  msrv:
    name: msrv (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      # Derive the toolchain from the manifest so the declared floor is the single source of
      # truth and this job cannot silently drift away from it.
      - id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `check`, not `test`: MSRV is a compilation property, and the stable `rust` job already
      # covers runtime behaviour. `--locked` matters here — without it cargo may re-resolve, and
      # the result would then describe a dependency set that is not the committed one.
      - name: check (default = mph + mmap)
        run: cargo check --all-targets --locked
      - name: check (no-default-features = fst only)
        run: cargo check --no-default-features --all-targets --locked
      - name: check (python bindings)
        run: cargo check --features python --locked
