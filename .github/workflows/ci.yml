name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Reused by release.yml: a tag must not publish what a push to main would have rejected.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt · clippy · test · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-llvm-cov
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default = with mph)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (no-default-features = fst only)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: test (default)
        run: cargo test
      - name: test (no-default-features)
        run: cargo test --no-default-features
      # Debug and release are different programs here: `debug_assert!`s inside ptr_hash and
      # cacheline-ef fire only in debug, and the optimiser is free to reorder the bounds reasoning
      # they document. The regression tests for the remap bound are only meaningful in both.
      - name: test (release)
        run: cargo test --release
      - name: cargo audit
        run: cargo audit
      - name: coverage (llvm-cov, floor 95% lines; default = mph + mmap)
        run: cargo llvm-cov --summary-only --fail-under-lines 95

  # The release workflow ships wheels for Windows and macOS, so their platform-specific code paths
  # — `save`'s rename-over-existing and permission handling, mmap — deserve a test run, not just a
  # cross-build. Tests only: fmt/clippy/audit/coverage are platform-independent and stay on the
  # Linux job above.
  rust-platforms:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test (default)
        run: cargo test
      - name: test (no-default-features)
        run: cargo test --no-default-features

  python-build:
    name: python (ruff · clippy · build)
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff check python/ tests/test_python.py
      - name: ruff format --check
        run: uvx ruff format --check python/ tests/test_python.py
      - name: clippy (python bindings)
        run: cargo clippy --features python -- -D warnings
      - name: build abi3 wheel
        run: uv run --with maturin maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  python-test:
    name: python (pytest · stubtest · py${{ matrix.python-version }})
    needs: python-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      # Install-only: the single abi3 wheel must import and pass on every supported interpreter.
      - name: pytest
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --python ${{ matrix.python-version }} --with pytest --with "$wheel" \
            pytest tests/test_python.py -q
      - name: stubtest
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --python ${{ matrix.python-version }} --with mypy --with "$wheel" \
            python -m mypy.stubtest lexindex

  msrv:
    name: msrv (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      # Derive the toolchain from the manifest so the declared floor is the single source of
      # truth and this job cannot silently drift away from it.
      - id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `check`, not `test`: MSRV is a compilation property, and the stable `rust` job already
      # covers runtime behaviour. `--locked` matters here — without it cargo may re-resolve, and
      # the result would then describe a dependency set that is not the committed one.
      - name: check (default = mph + mmap)
        run: cargo check --all-targets --locked
      - name: check (no-default-features = fst only)
        run: cargo check --no-default-features --all-targets --locked
      - name: check (python bindings)
        run: cargo check --features python --locked
