name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Reused by release.yml: a tag must not publish what a push to main would have rejected.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt · clippy · test · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default = with mph)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (no-default-features = fst only)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      # A combination the README tells people to use (`default-features = false`, `features =
      # ["mph"]`) and the one wasm32 builds, since there is nothing there to memory-map.
      - name: clippy (mph without mmap)
        run: cargo clippy --no-default-features --features mph --all-targets -- -D warnings
      # A feature no job builds is a feature that breaks quietly; `bench-mphf` holds the MPH's
      # measurements, which are `#[ignore]`d and so never run here -- but they still have to compile.
      - name: clippy (bench-mphf = the MPH measurements)
        run: cargo clippy --features bench-mphf --all-targets -- -D warnings
      - name: clippy (fuzzing = the shims the fuzz targets call)
        run: cargo clippy --features fuzzing --all-targets -- -D warnings
      - name: test (default)
        run: cargo test
      - name: test (no-default-features)
        run: cargo test --no-default-features
      # Debug and release are different programs here: the MPH's `debug_assert!`s fire only in
      # debug, while the optimiser is free to reorder the bounds reasoning they document. The
      # regression tests for the remap bound are only meaningful in both.
      - name: test (release)
        run: cargo test --release
      # The `fuzzing` feature is off by default and `sanitize.yml` only runs weekly, so the test
      # that keeps the fuzz seed corpus current has no other job that builds it. It went stale for
      # exactly that reason once already: 1.0 changed the blob formats and every seed became a
      # blob refused on its magic, which the fuzzers would have reported as a clean run.
      - name: test (fuzzing = the fuzz seed corpus is still a corpus)
        run: cargo test --features fuzzing --test golden
      - name: cargo audit
        run: cargo audit
      # Advisories are `cargo audit`'s job and it is the RustSec tool for them; this is the rest of
      # what the dependency tree can say -- a copyleft or unrecognised licence, two versions of one
      # crate, a `*` requirement, a source that is not crates.io. Named subcommands, so the two
      # tools do not both report the same advisory under different exit codes.
      - name: cargo deny (licences, bans, sources)
        run: cargo deny check licenses bans sources
      - name: coverage (llvm-cov, floor 95% lines; default = mph + mmap)
        run: cargo llvm-cov --summary-only --fail-under-lines 95

  # The release workflow ships wheels for Windows and macOS, so their platform-specific code paths
  # — `save`'s rename-over-existing and permission handling, mmap — deserve a test run, not just a
  # cross-build. Tests only: fmt/clippy/audit/coverage are platform-independent and stay on the
  # Linux job above.
  rust-platforms:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: test (default)
        run: cargo test
      - name: test (no-default-features)
        run: cargo test --no-default-features

  python-build:
    name: python (ruff · clippy · build)
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: ruff check
        run: uvx ruff check python/ tests/test_python.py
      - name: ruff format --check
        run: uvx ruff format --check python/ tests/test_python.py
      - name: clippy (python bindings)
        run: cargo clippy --features python -- -D warnings
      - name: build abi3 wheel
        run: uv run --with maturin maturin build --release --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel
          path: dist/*.whl

  python-test:
    name: python (pytest · stubtest · py${{ matrix.python-version }})
    needs: python-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel
          path: dist
      # Install-only: the single abi3 wheel must import and pass on every supported interpreter.
      # `numpy` is not decoration: the only check that `ids_of_bytes` is actually zero-copy reads
      # `np.frombuffer(...).base`, and without numpy installed it skipped here silently for as long
      # as it existed. `LEXINDEX_REQUIRE_NUMPY` turns that skip back into a failure.
      - name: pytest
        env:
          LEXINDEX_REQUIRE_NUMPY: "1"
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --python ${{ matrix.python-version }} --with pytest --with numpy --with "$wheel" \
            pytest tests/test_python.py -q
      - name: stubtest
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --python ${{ matrix.python-version }} --with mypy --with "$wheel" \
            python -m mypy.stubtest lexindex

  # The free-threaded build needs its own wheel: the module declares `Py_MOD_GIL_NOT_USED`, and
  # free-threaded CPython has no stable ABI before 3.15, so the abi3 wheel `python-build` produces
  # will not load on `3.14t` at all. Without this job the threading guarantee in `docs/usage.md`
  # rots the first time the bindings are touched -- the two concurrency tests cannot fail on a GIL
  # build, because the GIL is what stops the interleaving they are about.
  python-freethreaded:
    name: python (pytest · py3.14t, free-threaded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: install a free-threaded interpreter
        run: uv python install 3.14t
      # maturin sees the free-threaded interpreter, warns that abi3 does not support it yet, and
      # builds version-specific off the same `python` feature -- no separate feature is needed.
      - name: build for 3.14t
        run: |
          uv run --python 3.14t --with maturin --no-project \
            maturin build --release --out dist-ft --interpreter python3.14t
      - name: pytest (GIL disabled)
        env:
          PYTHON_GIL: "0"
          LEXINDEX_REQUIRE_NUMPY: "1"
        run: |
          wheel=$(ls dist-ft/*.whl | head -1)
          uv run --python 3.14t --no-project --with pytest --with numpy --with "$wheel" \
            pytest tests/test_python.py -q

  # The whole library builds on 32-bit since 1.0, `mph` included, and the README says so. `check`,
  # not `test`: there is no 32-bit runner to execute on, and the property is a compilation one --
  # what a 32-bit target could get wrong at runtime is a `u64 -> usize` truncation, and every one on
  # a load path is a `try_from` that fails identically at any width.
  targets:
    name: targets (32-bit and wasm, with mph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: check (fst-only, i686)
        run: cargo check --no-default-features --target i686-unknown-linux-gnu
      - name: check (fst-only, wasm32)
        run: cargo check --no-default-features --target wasm32-unknown-unknown
      - name: check (default = mph + mmap, i686)
        run: cargo check --all-targets --target i686-unknown-linux-gnu
      # No `mmap` on wasm32: `memmap2` has nothing to map there. `mph` alone is the interesting
      # half anyway -- it is the one that was 64-bit-only.
      - name: check (mph, wasm32)
        run: cargo check --no-default-features --features mph --target wasm32-unknown-unknown

  # Catches an *API* break that the version number does not admit to. It cannot catch the kind of
  # break 1.0 actually is -- refusing every pre-1.0 blob is a change in what the bytes mean, and the
  # public signatures did not shrink at all, so this job passed clean across that release. Necessary,
  # not sufficient: the CHANGELOG's "Changed - breaking" section is the other half, and it is the
  # half a human writes.
  semver:
    name: semver-checks (public API against the published version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks
        run: cargo semver-checks check-release

  # A workflow file is the one thing in the repo that nothing else compiles, parses or runs. A
  # malformed one does not fail loudly -- GitHub drops the whole file, reports a 0s "failure" under
  # its path instead of its name, and the job it was supposed to run simply stops existing. That is
  # how the weekly sanitizer job went three pushes without running: an unquoted `-- arena:: overlay::`
  # made `: ` a mapping indicator. This job is the parser the workflows otherwise never meet.
  workflows:
    name: actionlint (the workflows parse and typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: actionlint
      - name: actionlint
        run: actionlint -color

  msrv:
    name: msrv (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Derive the toolchain from the manifest so the declared floor is the single source of
      # truth and this job cannot silently drift away from it.
      - id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `check`, not `test`: MSRV is a compilation property, and the stable `rust` job already
      # covers runtime behaviour. `--locked` matters here — without it cargo may re-resolve, and
      # the result would then describe a dependency set that is not the committed one.
      - name: check (default = mph + mmap)
        run: cargo check --all-targets --locked
      - name: check (no-default-features = fst only)
        run: cargo check --no-default-features --all-targets --locked
      - name: check (python bindings)
        run: cargo check --features python --locked
