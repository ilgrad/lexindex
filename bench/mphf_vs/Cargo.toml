# One-process comparison of lexindex's perfect hash with PtrHash, PHast and PHastR over the same
# keys. Its own crate, outside the workspace, so the competitors never become dependencies of
# lexindex: `cd bench/mphf_vs && cargo run --release -- [n] [rounds] [threads]`.
[package]
name = "mphf_vs"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# PHastR's constructors take a progress logger, and its size is read through `mem_dbg`: both at the
# versions `sux` itself requires.
dsi-progress-logger = "0.8.7"
lexindex = { path = "../..", features = ["bench-mphf"] }
mem_dbg = "0.4.1"
ph = { version = "0.11.0", features = ["wyhash"] }
ptr_hash = "2.1.1"
rayon = "1"
# Without the default `flate2` and `zstd`: they read compressed key files, which nothing here does.
sux = { version = "0.15.0", default-features = false, features = ["rayon"] }

[profile.release]
opt-level = 3
