[package]
name = "lexindex"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Compact, immutable string↔id indexes for huge catalogs: an ordered FST with prefix/range/fuzzy queries, plus minimal-perfect-hash dictionaries (the compact one is ~1.3 B/key)."
authors = ["Ilia Gradina <ilia.gradina@gmail.com>"]
repository = "https://github.com/ilgrad/lexindex"
readme = "README.md"
keywords = ["index", "fst", "perfect-hash", "prefix", "catalog"]
categories = ["data-structures", "text-processing"]

[lib]
name = "lexindex"
# `cdylib` for the Python extension module (maturin/PyO3); `rlib` for use as a normal Rust crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `levenshtein` adds the bounded edit-distance automaton (tiny `utf8-ranges` dep) for fuzzy search.
fst = { version = "0.4", features = ["levenshtein"] }
ptr_hash = { version = "1.1", optional = true }
# epserde serialises the ptr_hash MPH for `PerfectHashIndex` persistence (already in the ptr_hash tree).
epserde = { version = "0.8", optional = true }
# memmap2 backs the zero-copy `load_mmap` path (the `mmap` feature). Read-only maps only.
memmap2 = { version = "0.9", optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"], optional = true }

[features]
default = ["mph", "mmap"]
# Minimal-perfect-hash dictionary (`PerfectHashIndex`), backed by the `ptr_hash` crate, with
# epserde-based persistence (`save`/`load`).
mph = ["dep:ptr_hash", "dep:epserde"]
# Zero-copy `load_mmap`: memory-map a saved blob and borrow the index from it (no read into RAM).
mmap = ["dep:memmap2"]
# Python bindings (PyO3 abi3 extension module); pulls in `mph` + `mmap` for the full API surface.
python = ["dep:pyo3", "mph", "mmap"]

# The benchmark compares PerfectHashIndex (mph) too, so it is skipped on a no-default-features build.
[[example]]
name = "bench"
required-features = ["mph"]

# The mmap demo loads a PerfectHashIndex zero-copy, so it needs both `mph` and `mmap`.
[[example]]
name = "mmap_zero_copy"
required-features = ["mph", "mmap"]

[dev-dependencies]
# Property-based tests: rank-walk round-trip invariants and deserialiser robustness on arbitrary bytes.
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
