# `include/lexindex.h` is generated from `src/capi.rs` alone, so no other module's `pub const` can
# leak into it:
#     cbindgen --config cbindgen.toml src/capi.rs --output include/lexindex.h
# CI regenerates it and fails on any difference, so the header cannot drift from the source.
language = "C"
include_guard = "LEXINDEX_H"
cpp_compat = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
autogen_warning = "/* Generated by cbindgen from src/capi.rs: edit that file, then `cbindgen --config cbindgen.toml src/capi.rs --output include/lexindex.h`. */"
style = "type"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
